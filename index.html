<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 3D Master Revision App - Pro Max</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

        :root {
            --primary: #6366f1; --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --success: #10b981; --success-dark: #059669;
            --dark: #1e293b;
            --bg-gradient: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient); background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            margin: 0; padding: 1.5vh 1vw; color: var(--dark);
            height: 100vh; box-sizing: border-box; overflow: hidden;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .app-container {
            width: 100%; height: 97vh; background: rgba(255, 255, 255, 0.9); border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2), inset 0 0 0 1px rgba(255,255,255,0.5);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }

        /* --- Tabs --- */
        .nav-tabs { display: flex; background: rgba(255, 255, 255, 0.5); padding: 15px; gap: 15px; border-bottom: 2px solid rgba(0,0,0,0.05); z-index: 10; align-items: center; }
        .tab-btn { flex: 1; padding: 12px 20px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; background: rgba(255, 255, 255, 0.7); color: #64748b; transition: 0.2s; }
        .tab-btn.active { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; box-shadow: 0 6px 0 #4338ca, 0 15px 20px rgba(99, 102, 241, 0.4); transform: translateY(-2px); }
        .tab-btn.active:active { transform: translateY(2px); box-shadow: 0 0px 0 #4338ca, 0 5px 10px rgba(99, 102, 241, 0.4); }

        .notif-btn { background: #fef08a; border: none; padding: 10px 15px; border-radius: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 0 #eab308; transition: 0.2s; color: #854d0e; }
        .notif-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #eab308; }

        .view-section { display: none; padding: 20px; flex: 1; overflow-y: auto; animation: popIn 0.4s; }
        .view-section.active { display: flex; flex-direction: column; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.98) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

        /* --- Dashboard Stats --- */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05), inset 0 2px 0 var(--primary); text-align: center; }
        .stat-card h3 { margin: 0; font-size: 42px; font-weight: 800; color: var(--dark); }
        .stat-card p { margin: 5px 0 0 0; color: #64748b; font-weight: 600; font-size: 16px; }

        .subject-progress-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .prog-card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 5px 15px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.05); }
        .prog-card h4 { margin: 0 0 15px 0; font-size: 18px; display: flex; justify-content: space-between; }
        .prog-bar-bg { width: 100%; height: 12px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
        .prog-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 10px; transition: width 1s; }
        .prog-card p { margin: 0; font-size: 13px; color: #64748b; font-weight: 600; text-align: right; }

        /* --- Inputs --- */
        .controls-header { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; }
        .input-group { display: flex; gap: 10px; flex: 1; min-width: 300px; }
        .input-group input { flex: 1; padding: 12px 20px; border: 2px solid #cbd5e1; border-radius: 12px; font-family: inherit; font-weight: 500; outline: none; }
        .input-group input:focus { border-color: var(--primary); }
        textarea { flex: 2; min-width: 300px; height: 50px; padding: 12px; border: 2px solid #cbd5e1; border-radius: 12px; font-family: inherit; resize: none; outline: none; }
        
        .btn-3d { background: linear-gradient(135deg, var(--success), #34d399); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 5px 0 var(--success-dark); transition: 0.1s; height: fit-content; }
        .btn-3d:active { transform: translateY(5px); box-shadow: 0 0px 0 var(--success-dark); }

        /* --- Table --- */
        .filter-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; flex-shrink: 0; }
        .pill { padding: 6px 18px; background: white; border-radius: 20px; cursor: pointer; font-weight: 600; border: 1px solid #cbd5e1; white-space: nowrap; }
        .pill.active { background: var(--dark); color: white; border-color: var(--dark); }

        .sheet-container { flex: 1; overflow: auto; border-radius: 8px; background: white; box-shadow: inset 0 0 0 1px #cbd5e1; padding-bottom: 80px; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; font-size: 14px; }
        thead th { position: sticky; top: 0; background: #f8fafc; color: #334155; padding: 12px; font-weight: 700; text-align: left; border: 1px solid #cbd5e1; box-shadow: 0 1px 0 #cbd5e1; z-index: 2; }
        td { padding: 8px 12px; border: 1px solid #e2e8f0; font-weight: 500; }
        tr:hover td { background: #f1f5f9; }
        
        .badge { padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 11px; text-transform: uppercase; }
        input[type="date"] { border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px 8px; font-family: inherit; font-weight: 600; background: #f8fafc; cursor: pointer; outline: none; }

        /* --- Planner --- */
        .planner-header { text-align: center; margin-bottom: 30px; flex-shrink: 0; }
        .date-selector { font-size: 20px; padding: 15px 30px; border: 2px solid var(--primary); border-radius: 16px; color: var(--primary); font-weight: 800; background: white; cursor: pointer; outline: none; }
        .planner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; overflow-y: auto; padding-bottom: 80px; }
        .subject-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); border-top: 6px solid var(--primary); }
        .topic-task { background: #f8fafc; padding: 12px 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .task-checkbox { width: 22px; height: 22px; border: 2px solid #94a3b8; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
        .topic-task.done { opacity: 0.5; background: #f1f5f9; }
        .topic-task.done .task-checkbox { background: var(--success); border-color: var(--success); }
        .topic-task.done .task-checkbox::after { content: '✓'; color: white; font-weight: bold; }
        .topic-task.done strong { text-decoration: line-through; }
        .rev-type { font-size: 11px; font-weight: 700; color: var(--secondary); background: #fdf2f8; padding: 3px 8px; border-radius: 4px; }
        .action-icon { background: transparent; color: #ef4444; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; border: none; font-size: 16px; }

        /* --- Floating Pomodoro Timer --- */
        .floating-timer {
            position: absolute; bottom: 20px; right: 20px; background: white;
            padding: 15px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 2px solid var(--primary); display: flex; align-items: center; gap: 15px; z-index: 100;
        }
        .timer-display { font-size: 24px; font-weight: 800; color: var(--primary-dark); font-variant-numeric: tabular-nums; }
        .timer-btn { background: var(--primary); color: white; border: none; border-radius: 8px; padding: 8px 15px; font-weight: 700; cursor: pointer; box-shadow: 0 3px 0 var(--primary-dark); }
        .timer-btn:active { transform: translateY(3px); box-shadow: 0 0 0 transparent; }

    </style>
</head>
<body>

<div class="app-container">
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('tracker')" id="btn-tracker">📊 Data Sheet</button>
        <button class="tab-btn" onclick="switchTab('planner')" id="btn-planner">🎯 Daily Planner</button>
        <button class="tab-btn" onclick="switchTab('progress')" id="btn-progress">📈 Progress</button>
        <button class="notif-btn" onclick="enableNotifications()">🔔 Alerts</button>
    </div>

    <!-- TRACKER -->
    <div id="view-tracker" class="view-section active">
        <div class="controls-header">
            <div class="input-group">
                <input type="text" id="subjectInput" placeholder="✍️ सब्जेक्ट (उदा: Maths - Abstract Algebra)" list="existingSubjects">
                <datalist id="existingSubjects"></datalist>
            </div>
            <textarea id="bulkTopicsList" placeholder="टॉपिक्स पेस्ट करें..."></textarea>
            <button class="btn-3d" onclick="addBulkTopics()">+ Add Data</button>
            <button class="btn-3d" style="background: #3b82f6; box-shadow: 0 5px 0 #1d4ed8;" onclick="exportData()">💾 Backup</button>
        </div>
        <div class="filter-container" id="subjectFilters"></div>
        <div class="sheet-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;">S.No</th>
                        <th style="width: 140px;">Subject</th>
                        <th>Topic Name</th>
                        <th style="width: 150px;">Start Date</th>
                        <th style="width: 130px;">1st Rev (Day 1)</th>
                        <th style="width: 130px;">2nd Rev (Day 3)</th>
                        <th style="width: 130px;">3rd Rev (Day 7)</th>
                        <th style="width: 60px;">Act</th>
                    </tr>
                </thead>
                <tbody id="sheetBody"></tbody>
            </table>
        </div>
    </div>

    <!-- PLANNER -->
    <div id="view-planner" class="view-section">
        <div class="planner-header">
            <input type="date" id="plannerDate" class="date-selector" onchange="renderPlanner()">
        </div>
        <div id="plannerContent" class="planner-grid"></div>
    </div>

    <!-- PROGRESS -->
    <div id="view-progress" class="view-section">
        <div class="stats-grid">
            <div class="stat-card"><h3 id="statTotal" style="color: var(--primary);">0</h3><p>कुल टॉपिक्स</p></div>
            <div class="stat-card"><h3 id="statStarted" style="color: var(--success);">0</h3><p>पढ़ना शुरू किया</p></div>
            <div class="stat-card"><h3 id="statDueToday" style="color: var(--secondary);">0</h3><p>आज का रिवीजन</p></div>
        </div>
        <div class="subject-progress-grid" id="subjectProgressGrid"></div>
    </div>

    <!-- FLOATING POMODORO TIMER -->
    <div class="floating-timer">
        <div>⏱️ Focus</div>
        <div class="timer-display" id="timerDisplay">25:00</div>
        <button class="timer-btn" onclick="toggleTimer()" id="timerToggleBtn">Start</button>
        <button class="timer-btn" style="background:#f43f5e; box-shadow: 0 3px 0 #be123c;" onclick="resetTimer()">Reset</button>
    </div>
</div>

<script>
    let trackerData = JSON.parse(localStorage.getItem('sheet_revision_data')) || [];
    let currentFilter = "ALL";
    const colors = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6'];
    let subjectColors = {};

    function getTodayString() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function formatDisplayDate(dateStr) {
        if(!dateStr) return "-";
        return new Date(dateStr).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    }

    function calcFutureDate(baseStr, days) {
        if(!baseStr) return "";
        const d = new Date(baseStr); d.setDate(d.getDate() + days);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    // --- Tab Switching & Rendering Logic --- (Same as before)
    function switchTab(tabName) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('view-' + tabName).classList.add('active');
        document.getElementById('btn-' + tabName).classList.add('active');

        if(tabName === 'planner') {
            if(!document.getElementById('plannerDate').value) document.getElementById('plannerDate').value = getTodayString();
            renderPlanner();
        } else if (tabName === 'tracker') { renderTracker(); } 
        else if (tabName === 'progress') { updateStats(); }
    }

    function getSubColor(sub) {
        if(!subjectColors[sub]) subjectColors[sub] = colors[Object.keys(subjectColors).length % colors.length];
        return subjectColors[sub];
    }

    function addBulkTopics() {
        const subInput = document.getElementById('subjectInput').value.trim() || "General";
        const textInput = document.getElementById('bulkTopicsList').value;
        if(!textInput.trim()) return;

        textInput.split('\n').forEach(line => {
            const name = line.trim();
            if(name) trackerData.push({ id: Date.now() + Math.random(), subject: subInput, topic: name, readDate: "", d1: "", d3: "", d7: "" });
        });
        document.getElementById('bulkTopicsList').value = "";
        saveDataAndRefresh();
    }

    function changeRowDate(id, dateVal) {
        const idx = trackerData.findIndex(item => item.id === id);
        if(idx !== -1) {
            trackerData[idx].readDate = dateVal;
            trackerData[idx].d1 = calcFutureDate(dateVal, 1);
            trackerData[idx].d3 = calcFutureDate(dateVal, 3);
            trackerData[idx].d7 = calcFutureDate(dateVal, 7);
            saveDataAndRefresh();
        }
    }

    function rowDelete(id) {
        if(confirm("डिलीट करें?")) { trackerData = trackerData.filter(item => item.id !== id); saveDataAndRefresh(); }
    }

    function saveDataAndRefresh() {
        trackerData.sort((a,b) => new Date(b.readDate || 0) - new Date(a.readDate || 0));
        localStorage.setItem('sheet_revision_data', JSON.stringify(trackerData));
        renderTracker(); updateStats();
        if(document.getElementById('view-planner').classList.contains('active')) renderPlanner();
    }

    function renderTracker() {
        const tbody = document.getElementById('sheetBody');
        const subjects = ["ALL", ...new Set(trackerData.map(item => item.subject))];
        document.getElementById('existingSubjects').innerHTML = subjects.filter(s => s !== "ALL").map(s => `<option value="${s}">`).join('');
        document.getElementById('subjectFilters').innerHTML = subjects.map(sub => 
            `<div class="pill ${currentFilter === sub ? 'active' : ''}" onclick="currentFilter='${sub}'; renderTracker()">${sub}</div>`
        ).join('');

        tbody.innerHTML = "";
        const today = getTodayString();
        trackerData.forEach((item, index) => {
            if(currentFilter !== "ALL" && item.subject !== currentFilter) return;
            const c = getSubColor(item.subject);
            const isDue = (item.d1 === today || item.d3 === today || item.d7 === today);
            tbody.innerHTML += `
                <tr style="${isDue ? 'background: #fef2f2;' : ''}">
                    <td>${index+1}</td>
                    <td><span class="badge" style="background:${c}15; color:${c}; border: 1px solid ${c}40;">${item.subject}</span></td>
                    <td style="font-weight:600;">${item.topic}</td>
                    <td><input type="date" value="${item.readDate}" onchange="changeRowDate(${item.id}, this.value)"></td>
                    <td style="${item.d1 === today ? 'color:#ef4444;font-weight:700;' : ''}">${formatDisplayDate(item.d1)}</td>
                    <td style="${item.d3 === today ? 'color:#ef4444;font-weight:700;' : ''}">${formatDisplayDate(item.d3)}</td>
                    <td style="${item.d7 === today ? 'color:#ef4444;font-weight:700;' : ''}">${formatDisplayDate(item.d7)}</td>
                    <td><button class="action-icon" onclick="rowDelete(${item.id})">🗑️</button></td>
                </tr>`;
        });
    }

    function renderPlanner() {
        const selectedDate = document.getElementById('plannerDate').value;
        const content = document.getElementById('plannerContent');
        if(!selectedDate) return;

        let dueData = {}; let totalCount = 0;
        trackerData.forEach(item => {
            let revLabel = null;
            if(item.d1 === selectedDate) revLabel = "1st Rev";
            else if(item.d3 === selectedDate) revLabel = "2nd Rev";
            else if(item.d7 === selectedDate) revLabel = "3rd Rev";

            if(revLabel) {
                if(!dueData[item.subject]) dueData[item.subject] = [];
                dueData[item.subject].push({ topic: item.topic, revType: revLabel });
                totalCount++;
            }
        });

        if(totalCount === 0) {
            content.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; background: white; border-radius: 20px; font-size: 18px; color: var(--success);">🎉 इस दिन कोई रिवीजन पेंडिंग नहीं है!</div>`;
            return;
        }

        let html = '';
        for (const [subject, topics] of Object.entries(dueData)) {
            const color = getSubColor(subject);
            html += `<div class="subject-card" style="border-top-color: ${color}"><h3 style="color: ${color}">📘 ${subject}</h3>`;
            topics.forEach(t => {
                html += `<div class="topic-task" onclick="this.classList.toggle('done')">
                            <div class="task-checkbox"></div>
                            <div><strong>${t.topic}</strong> <span class="rev-type">${t.revType}</span></div>
                         </div>`;
            });
            html += `</div>`;
        }
        content.innerHTML = html;
    }

    function updateStats() {
        const today = getTodayString(); let started = 0, dueToday = 0; let subStats = {};
        trackerData.forEach(t => {
            if(!subStats[t.subject]) subStats[t.subject] = { total: 0, started: 0 };
            subStats[t.subject].total++;
            if(t.readDate) { started++; subStats[t.subject].started++; }
            if(t.d1 === today || t.d3 === today || t.d7 === today) dueToday++;
        });

        document.getElementById('statTotal').innerText = trackerData.length;
        document.getElementById('statStarted').innerText = started;
        document.getElementById('statDueToday').innerText = dueToday;

        let subHtml = '';
        for(const [sub, data] of Object.entries(subStats)) {
            let pct = data.total > 0 ? Math.round((data.started / data.total) * 100) : 0;
            let c = getSubColor(sub);
            subHtml += `<div class="prog-card">
                    <h4><span>${sub}</span><span style="color:${c}">${pct}%</span></h4>
                    <div class="prog-bar-bg"><div class="prog-bar-fill" style="width: ${pct}%; background: ${c};"></div></div>
                    <p>${data.started} / ${data.total} Completed</p></div>`;
        }
        document.getElementById('subjectProgressGrid').innerHTML = subHtml;
    }

    // ================= NEW FEATURE: NOTIFICATIONS =================
    function enableNotifications() {
        if (!("Notification" in window)) {
            alert("आपका ब्राउज़र नोटिफिकेशन्स सपोर्ट नहीं करता।");
        } else if (Notification.permission === "granted") {
            alert("नोटिफिकेशन्स पहले से ऑन हैं! ✅");
        } else if (Notification.permission !== "denied") {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") alert("नोटिफिकेशन्स ऑन हो गए हैं! 🚀");
            });
        }
    }

    function checkAndSendDailyAlert() {
        if (!("Notification" in window) || Notification.permission !== "granted") return;
        
        const today = getTodayString();
        const lastNotif = localStorage.getItem('last_notif_date');
        
        // दिन में सिर्फ एक बार अलर्ट भेजने के लिए
        if(lastNotif === today) return; 

        let dueCount = 0;
        trackerData.forEach(t => {
            if(t.d1 === today || t.d3 === today || t.d7 === today) dueCount++;
        });

        if(dueCount > 0) {
            new Notification("📚 रिवीजन रिमाइंडर!", {
                body: `गुड मॉर्निंग! आज आपके ${dueCount} टॉपिक्स का रिवीजन पेंडिंग है। डेली प्लानर चेक करें।`,
                icon: "https://cdn-icons-png.flaticon.com/512/3106/3106301.png"
            });
            localStorage.setItem('last_notif_date', today);
        }
    }

    // ================= NEW FEATURE: POMODORO TIMER =================
    let timerInterval;
    let timeLeft = 25 * 60; // 25 Minutes
    let isTimerRunning = false;

    function updateTimerDisplay() {
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        document.getElementById('timerDisplay').innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function toggleTimer() {
        const btn = document.getElementById('timerToggleBtn');
        if(isTimerRunning) {
            clearInterval(timerInterval);
            btn.innerText = "Start";
            btn.style.background = "var(--primary)";
        } else {
            timerInterval = setInterval(() => {
                if(timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    if("Notification" in window && Notification.permission === "granted") {
                        new Notification("⏰ समय समाप्त!", { body: "आपके 25 मिनट पूरे हुए। 5 मिनट का ब्रेक लें!" });
                    } else { alert("⏰ समय समाप्त! ब्रेक लें।"); }
                    resetTimer();
                }
            }, 1000);
            btn.innerText = "Pause";
            btn.style.background = "#f59e0b"; // warning color
        }
        isTimerRunning = !isTimerRunning;
    }

    function resetTimer() {
        clearInterval(timerInterval);
        isTimerRunning = false;
        timeLeft = 25 * 60;
        updateTimerDisplay();
        const btn = document.getElementById('timerToggleBtn');
        btn.innerText = "Start";
        btn.style.background = "var(--primary)";
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(trackerData));
        const a = document.createElement('a'); a.href = dataStr; a.download = "RPSC_ProMax_Backup.json";
        document.body.appendChild(a); a.click(); a.remove();
    }

    window.onload = () => {
        renderTracker();
        updateStats();
        // Check for notifications slightly after page load
        setTimeout(checkAndSendDailyAlert, 2000); 
    };
</script>
</body>
</html>
